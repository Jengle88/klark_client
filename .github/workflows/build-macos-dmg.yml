name: macOS DMG Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build debug DMG
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build DMG package
      run: ./gradlew :composeApp:packageDmg
        
    - name: Upload DMG
      uses: actions/upload-artifact@v4
      with:
        name: debug-dmg
        path: app/build/outputs/dmg/debug-dmg.dmg
