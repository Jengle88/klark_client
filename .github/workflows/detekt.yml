name: Detekt Static Code Analysis

# Trigger workflow on push or pull request to main/master branches
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  detekt:
    runs-on: ubuntu-latest
    
    steps:
      # Checkout the repository code
      - name: Checkout code
        uses: actions/checkout@v4
      
      # Set up JDK 17 for building and running Gradle tasks
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      # Setup Gradle with caching for faster builds
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      
      # Run Detekt static analysis
      # Detekt will use default rules or custom detekt-config.yml if present
      - name: Run Detekt analysis
        run: ./gradlew detekt
      
      # Upload Detekt results as artifacts for review
      # Results include HTML and XML reports
      - name: Upload Detekt results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detekt-results
          path: |
            composeApp/build/reports/detekt/
          retention-days: 14
