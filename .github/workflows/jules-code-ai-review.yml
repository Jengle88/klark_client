name: jules-code-ai-review.yml
on: [pull_request]

jobs:
  jules_job:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Jules AI Agent
        uses: google-labs-code/jules-action@v1.0.0
        with:
          api-key: ${{ secrets.JULES_API_KEY }}
          prompt: "Review this pull request for logic errors and performance bottlenecks."